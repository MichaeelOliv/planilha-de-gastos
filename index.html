<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos com Exportação PDF</title>
    <!-- Biblioteca externa para geração de PDF a partir do HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .balance-card {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-card h3 {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
        }

        .balance-card p {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .btn-export {
            background-color: #059669;
        }

        .btn-export:hover {
            background-color: #047857;
        }

        .history {
            margin-top: 25px;
        }

        .history h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background-color: #f8fafc;
            border-left: 5px solid #ccc;
        }

        li.income {
            border-left-color: #10b981;
        }

        li.expense {
            border-left-color: #ef4444;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            width: auto;
            padding: 0 5px;
            font-size: 14px;
        }

        /* Oculta o botão de exclusão durante a impressão/PDF */
        @media print {
            .delete-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container" id="pdf-content">
    <h2>Controle Financeiro</h2>

    <div class="balance-card">
        <h3>Saldo Atual</h3>
        <p id="balance">R$ 0,00</p>
    </div>

    <form id="transaction-form" data-html2pdf-ignore="true">
        <div class="form-group">
            <label for="description">Descrição</label>
            <input type="text" id="description" placeholder="Ex: Salário, Mercado..." required>
        </div>

        <div class="form-group">
            <label for="amount">Valor (R$)</label>
            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="type">Tipo</label>
            <select id="type">
                <option value="income">Entrada (+)</option>
                <option value="expense">Saída (-)</option>
            </select>
        </div>

        <button type="submit">Adicionar Transação</button>
    </form>

    <div style="margin-top: 10px;" data-html2pdf-ignore="true">
        <button type="button" class="btn-export" onclick="exportToPDF()">📄 Exportar para PDF</button>
    </div>

    <div class="history">
        <h3>Histórico de Transações</h3>
        <ul id="transaction-list"></ul>
    </div>
</div>

<script>
    const balanceEl = document.getElementById('balance');
    const form = document.getElementById('transaction-form');
    const descriptionInput = document.getElementById('description');
    const amountInput = document.getElementById('amount');
    const typeInput = document.getElementById('type');
    const listEl = document.getElementById('transaction-list');

    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    function formatCurrency(value) {
        return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function updateUI() {
        listEl.innerHTML = '';
        let total = 0;

        transactions.forEach((transaction, index) => {
            const isIncome = transaction.type === 'income';
            const amount = isIncome ? transaction.amount : -transaction.amount;
            total += amount;

            const li = document.createElement('li');
            li.classList.add(isIncome ? 'income' : 'expense');

            li.innerHTML = `
                <span>${transaction.description}</span>
                <span>
                    ${formatCurrency(amount)}
                    <button class="delete-btn" data-html2pdf-ignore="true" onclick="removeTransaction(${index})">✕</button>
                </span>
            `;

            listEl.appendChild(li);
        });

        balanceEl.textContent = formatCurrency(total);
        localStorage.setItem('transactions', JSON.stringify(transactions));
    }

    function addTransaction(e) {
        e.preventDefault();

        const description = descriptionInput.value.trim();
        const amount = parseFloat(amountInput.value);
        const type = typeInput.value;

        if (description === '' || isNaN(amount) || amount <= 0) return;

        transactions.push({ description, amount, type });

        descriptionInput.value = '';
        amountInput.value = '';

        updateUI();
    }

    function removeTransaction(index) {
        transactions.splice(index, 1);
        updateUI();
    }

    function exportToPDF() {
        const element = document.getElementById('pdf-content');
        const opt = {
            margin:       10,
            filename:     'relatorio-financeiro.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save();
    }

    form.addEventListener('submit', addTransaction);
    updateUI();
</script>

</body>
</html>
